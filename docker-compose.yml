

networks:
  distrosense:
    driver: bridge

volumes:
  timescale_data:
  neo4j_data:
  es_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  flink_state:

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    networks: [distrosense]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    networks: [distrosense]
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Flink's exactly-once Kafka sinks use transactions; on a single broker the transaction
      # log must be created with replication factor 1 (the default of 3 can never be satisfied).
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    networks: [distrosense]
    depends_on: [kafka]
    restart: "no"
    volumes:
      - ./infra/kafka/topic-init.sh:/topic-init.sh
    entrypoint: ["/bin/bash", "/topic-init.sh"]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema-registry
    networks: [distrosense]
    depends_on: [kafka]
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    networks: [distrosense]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: distrosense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./infra/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql

  neo4j:
    image: neo4j:5.18
    container_name: neo4j
    networks: [distrosense]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/distrosense
    volumes:
      - neo4j_data:/data

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: elasticsearch
    networks: [distrosense]
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data

  redis:
    image: redis:7.2-alpine
    container_name: redis
    networks: [distrosense]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # The PyFlink job (flink_jobs/). It sits behind a profile so a plain `docker compose up`
  # does not start it (JVM + Python workers need ~2 GB):
  #   docker compose --profile flink up -d --build flink
  flink:
    profiles: ["flink"]
    build:
      context: .
      dockerfile: flink_jobs/Dockerfile
    image: distrosense-flink
    container_name: flink-jobs
    networks: [distrosense]
    depends_on: [kafka, schema-registry, timescaledb, redis]
    mem_limit: 2200m
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      TIMESCALE_HOST: timescaledb
      REDIS_HOST: redis
      FLINK_STATE_DIR: /state
      FLINK_PARALLELISM: ${FLINK_PARALLELISM:-1}
      FLINK_AUTO_OFFSET_RESET: ${FLINK_AUTO_OFFSET_RESET:-latest}
    ports:
      - "9101:9101"   # Prometheus metrics (scraped as host.docker.internal:9101)
      - "8082:8082"   # Flink Web UI
    volumes:
      - flink_state:/state
    restart: on-failure:3

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks: [distrosense]
    extra_hosts:
      - "host.docker.internal:host-gateway"   # scrape the host-run stages (needed on Linux; automatic on Docker Desktop)
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks: [distrosense]
    ports:
      - "3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning