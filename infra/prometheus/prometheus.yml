global:
  scrape_interval: 15s

# The DistroSense stages run on the host (python -m ...), not inside compose, so
# Prometheus (a container) reaches them through host.docker.internal. The one exception is
# the PyFlink job (compose service `flink`), whose metrics port 9101 is published to the
# host, so the same host.docker.internal:9101 target reaches it.
# Ports: ingestion 8000 (/metrics on the REST app), simulator 9100, flink jobs 9101,
# correlation 9102, orchestrator 9103.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: distrosense-ingestion
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: distrosense-simulator
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: distrosense-flink
    static_configs:
      - targets: ["host.docker.internal:9101"]

  - job_name: distrosense-correlation
    static_configs:
      - targets: ["host.docker.internal:9102"]

  - job_name: distrosense-orchestrator
    static_configs:
      - targets: ["host.docker.internal:9103"]

  # The ML inference service is not on the live path yet; add it here when it is
  # wired in and exposes /metrics (it used to be listed as ml-service:8002, which
  # never existed, so the target was permanently down).
